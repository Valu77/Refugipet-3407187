
services:
  db:
    image: postgres:18
    container_name: refugipet_postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: refugipet
      POSTGRES_USER: refugipet
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    ports:
      - "5433:5432"

    volumes:
      - refugipet_data:/var/lib/postgresql

volumes:
  refugipet_data:
